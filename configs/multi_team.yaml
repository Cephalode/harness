# Multi-Team Agentic Coding Harness Configuration
#
# Runtime: PI coding agent (pi -p)
# Models: z-ai provider only — Coding Plan subscription
#   glm-5.1 (flagship), glm-4.7 (workhorse), glm-4.5-air (budget/overflow)
#   glm-5-turbo reserved for Ocythoe (Hermes) only — NOT used by harness agents
#
# Default: glm-5.1 everywhere; degrades to glm-4.7 → glm-4.5-air when concurrent slots fill
#
# Concurrency limits: 10× glm-5.1, 2× glm-4.7, 5× glm-4.5-air

orchestrator:
  name: orchestrator
  model: "z-ai/glm-5.1"
  system_prompt: agents/orchestrator.md
  expertise:
    - path: expertise/orchestrator.md
      updatable: true
      max_lines: 10000
  skills:
    - skills/active_listener.md
    - skills/zero_micromanagement.md
    - skills/conversational_response.md
    - skills/mental_model.md
    - skills/delegate.md

teams:
  - name: planning
    color: blue
    lead:
      name: planning_lead
      model: "z-ai/glm-5.1"
      fallback_models:
        - "z-ai/glm-4.7"
        - "z-ai/glm-4.5-air"
      system_prompt: agents/planning_lead.md
      expertise:
        - path: expertise/planning_lead.md
          updatable: true
          max_lines: 10000
      skills:
        - skills/active_listener.md
        - skills/zero_micromanagement.md
        - skills/conversational_response.md
        - skills/mental_model.md
        - skills/delegate.md
      domain:
        read: ["."]
        update: ["expertise/", "specs/"]
    workers:
      - name: planner
        model: "z-ai/glm-5.1"
        fallback_models:
          - "z-ai/glm-4.7"
          - "z-ai/glm-4.5-air"
        system_prompt: agents/planner.md
        skills:
          - skills/active_listener.md
          - skills/mental_model.md
        domain:
          read: ["."]
          update: ["expertise/"]
      - name: spec_writer
        model: "z-ai/glm-5.1"
        fallback_models:
          - "z-ai/glm-4.7"
          - "z-ai/glm-4.5-air"
        system_prompt: agents/spec_writer.md
        skills:
          - skills/active_listener.md
          - skills/mental_model.md
        domain:
          read: ["."]
          update: ["expertise/", "docs/", "specs/"]

  # ── Engineering team with A/B instances ──────────────────────────
  # Team A and Team B run in parallel with the same model pool (z-ai only)
  # when instances are expanded by the orchestrator.
  - name: engineering
    color: green
    instances:
      - name: engineering_A
        models:
          engineering_lead: "z-ai/glm-5.1"
          frontend_dev: "z-ai/glm-5.1"
          backend_dev: "z-ai/glm-5.1"
          fullstack_engineer_claude: "anthropic/claude-sonnet-4-6"
          browser_harness_agent: "anthropic/claude-sonnet-4-6"
      - name: engineering_B
        models:
          engineering_lead: "z-ai/glm-5.1"
          frontend_dev: "z-ai/glm-5.1"
          backend_dev: "z-ai/glm-5.1"
    lead:
      name: engineering_lead
      model: "z-ai/glm-5.1"
      fallback_models:
        - "z-ai/glm-4.7"
        - "z-ai/glm-4.5-air"
      system_prompt: agents/engineering_lead.md
      expertise:
        - path: expertise/engineering_lead.md
          updatable: true
          max_lines: 10000
        - path: expertise/coding_standards.md
          updatable: false
          max_lines: 500
      skills:
        - skills/active_listener.md
        - skills/zero_micromanagement.md
        - skills/conversational_response.md
        - skills/mental_model.md
        - skills/delegate.md
      domain:
        read: ["."]
        update: ["expertise/"]
    workers:
      - name: frontend_dev
        model: "z-ai/glm-5.1"
        fallback_models:
          - "z-ai/glm-4.7"
          - "z-ai/glm-4.5-air"
        system_prompt: agents/frontend_dev.md
        domain:
          read: ["."]
          update: ["frontend/", "src/components/", "src/styles/"]
      - name: backend_dev
        model: "z-ai/glm-5.1"
        fallback_models:
          - "z-ai/glm-4.7"
          - "z-ai/glm-4.5-air"
        system_prompt: agents/backend_dev.md
        domain:
          read: ["."]
          update: ["backend/", "src/api/", "src/models/", "src/services/"]
      - name: browser_harness_agent
        executor: claude-code
        model: "anthropic/claude-sonnet-4-6"
        fallback_models:
          - "anthropic/claude-haiku-3-5"
        system_prompt: agents/browser_harness_agent.md
        only_instances: [engineering_A]
        domain:
          read: ["."]
          update: ["browser/", "e2e/", "tests/"]
      - name: network_engineer
        model: "z-ai/glm-5.1"
        fallback_models:
          - "z-ai/glm-4.7"
          - "z-ai/glm-4.5-air"
        system_prompt: agents/network_engineer.md
        only_instances: [engineering_A]
        domain:
          read: ["."]
          update: ["config/network/", "config/firewall/", "config/dns/", "infra/", "scripts/network/"]
      - name: devops_engineer
        model: "z-ai/glm-5.1"
        fallback_models:
          - "z-ai/glm-4.7"
          - "z-ai/glm-4.5-air"
        system_prompt: agents/devops_engineer.md
        domain:
          read: ["."]
          update: [".github/workflows/", "deploy/", "infra/", "scripts/", "expertise/"]
      - name: fullstack_engineer_claude
        executor: claude-code
        model: "anthropic/claude-sonnet-4-6"
        fallback_models:
          - "anthropic/claude-haiku-3-5"
        system_prompt: agents/fullstack_engineer_claude.md
        only_instances: [engineering_A]
        domain:
          read: ["."]
          update: ["frontend/", "src/components/", "src/styles/", "backend/", "src/api/", "src/models/", "src/services/", "tests/"]

  - name: research
    color: cyan
    lead:
      name: research_lead
      model: "z-ai/glm-5.1"
      fallback_models:
        - "z-ai/glm-4.7"
        - "z-ai/glm-4.5-air"
      system_prompt: agents/research_lead.md
      expertise:
        - path: expertise/research_lead.md
          updatable: true
          max_lines: 10000
      skills:
        - skills/active_listener.md
        - skills/zero_micromanagement.md
        - skills/conversational_response.md
        - skills/mental_model.md
        - skills/delegate.md
        - skills/web_research.md
      domain:
        read: ["."]
        update: ["expertise/", "docs/", "research/"]
    workers:
      - name: deep_researcher
        model: "z-ai/glm-5.1"
        fallback_models:
          - "z-ai/glm-4.7"
          - "z-ai/glm-4.5-air"
        system_prompt: agents/deep_researcher.md
        skills:
          - skills/web_research.md
        domain:
          read: ["."]
          update: ["docs/", "research/"]
      - name: code_investigator
        model: "z-ai/glm-5.1"
        fallback_models:
          - "z-ai/glm-4.7"
          - "z-ai/glm-4.5-air"
        system_prompt: agents/code_investigator.md
        domain:
          read: ["."]
          update: ["expertise/", "docs/"]
      - name: evaluation_analyst
        model: "z-ai/glm-5.1"
        fallback_models:
          - "z-ai/glm-4.7"
          - "z-ai/glm-4.5-air"
        system_prompt: agents/evaluation_analyst.md
        skills:
          - skills/web_research.md
          - skills/mental_model.md
        domain:
          read: ["."]
          update: ["research/", "docs/", "expertise/"]

  - name: validation
    color: red
    lead:
      name: validation_lead
      model: "z-ai/glm-5.1"
      fallback_models:
        - "z-ai/glm-4.7"
        - "z-ai/glm-4.5-air"
      system_prompt: agents/validation_lead.md
      expertise:
        - path: expertise/validation_lead.md
          updatable: true
          max_lines: 10000
      skills:
        - skills/active_listener.md
        - skills/zero_micromanagement.md
        - skills/conversational_response.md
        - skills/mental_model.md
        - skills/delegate.md
      domain:
        read: ["."]
        update: ["expertise/"]
    workers:
      - name: qa_engineer
        model: "z-ai/glm-5.1"
        fallback_models:
          - "z-ai/glm-4.7"
          - "z-ai/glm-4.5-air"
        system_prompt: agents/qa_engineer.md
        domain:
          read: ["."]
          update: ["tests/", "expertise/"]
      - name: security_reviewer
        model: "z-ai/glm-5.1"
        fallback_models:
          - "z-ai/glm-4.7"
          - "z-ai/glm-4.5-air"
        system_prompt: agents/security_reviewer.md
        domain:
          read: ["."]
          update: ["expertise/"]
      - name: visual_reviewer
        executor: claude-code
        model: "anthropic/claude-sonnet-4-6"
        vision: true
        fallback_models:
          - "anthropic/claude-haiku-3-5"
        system_prompt: agents/visual_reviewer.md
        domain:
          read: ["."]
          update: ["expertise/"]
      - name: performance_engineer
        model: "z-ai/glm-5.1"
        fallback_models:
          - "z-ai/glm-4.7"
          - "z-ai/glm-4.5-air"
        system_prompt: agents/performance_engineer.md
        domain:
          read: ["."]
          update: ["tests/perf/", "tests/load/", "expertise/"]

# ── Reusable Command Workflows ────────────────────────────────────
# Invoke with: <command_name>: <user input>
# e.g. "plan-build-validate: add OAuth2 login flow"
commands:
  - name: plan-build-validate
    description: "Plan a feature, implement it, then validate — full lifecycle"
    steps:
      - team: planning
        prompt: "Create a detailed implementation plan for: {input}"
      - team: engineering_A
        prompt: |
          Implement the following plan:

          {prev_result}

          Original request: {input}
      - team: validation
        prompt: |
          Review and test the implementation of: {input}

          Implementation summary:
          {prev_result}

          Check for bugs, missing tests, security issues, and code quality.

  - name: plan
    description: "Plan a feature without implementing — specs only"
    steps:
      - team: planning
        prompt: "Create a detailed implementation plan for: {input}"

  - name: build
    description: "Send a task directly to engineering team A"
    steps:
      - team: engineering_A
        prompt: "Implement the following: {input}"

  - name: build-compete
    description: "Run engineering teams A and B in parallel for competitive implementation"
    steps:
      - team: engineering_A
        prompt: "Implement the following. You are Team A — focus on correctness and clean architecture: {input}"
      - team: engineering_B
        prompt: "Implement the following. You are Team B — focus on performance and elegant solutions: {input}"

  - name: review
    description: "Run validation team against a description of what was built"
    steps:
      - team: validation
        prompt: "Review the following code change for bugs, security issues, and test coverage: {input}"

  - name: research-plan-build-validate
    description: "Research → Plan → Build → Validate — full lifecycle with research phase"
    steps:
      - team: research
        prompt: "Investigate and gather information about: {input}"
      - team: planning
        prompt: "Based on this research, create an implementation plan for: {input}\n\nResearch:\n{prev_result}"
      - team: engineering_A
        prompt: "Implement this plan:\n{prev_result}\n\nOriginal request: {input}"
      - team: validation
        prompt: "Review and test the implementation of: {input}\n{prev_result}"

  - name: full-pipeline
    description: "Plan → competing implementations A+B → validate the best approach"
    steps:
      - team: planning
        prompt: "Create a detailed implementation plan for: {input}"
      - team: engineering_A
        prompt: |
          You are Team A. Implement this plan focusing on correctness and clean architecture:

          {prev_result}

          Original request: {input}
      - team: engineering_B
        prompt: |
          You are Team B. Implement this plan focusing on performance and elegance:

          {prev_result}

          Original request: {input}
      - team: validation
        prompt: |
          Review BOTH team implementations of: {input}

          Team A result is from the previous step.
          Compare the two approaches and recommend the best one, or suggest merging the best parts.
